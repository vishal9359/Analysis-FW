syntax = "proto3";

package iopattern;

option go_package = "linux_tracer/proto;main";

enum IoType {
    UNSPECIFIED = 0;

    READ = 1;
    READV = 2;
    PREAD = 3;
    PREADV = 4;
    WRITE = 5;
    WRITEV = 6;
    PWRITE = 7;
    PWRITEV = 8;

    AIO_PREAD = 9;
    AIO_PREADV = 10;
    AIO_PWRITE = 11;
    AIO_PWRITEV = 12;

    IOURING_READ = 13;
    IOURING_READV = 14;
    IOURING_READ_FIXED = 15;
    IOURING_WRITE = 16;
    IOURING_WRITEV = 17;
    IOURING_WRITE_FIXED = 18;
}

message GenericFormat {
    optional string timestamp = 1;
    optional string hostname = 2;
    optional uint32 component = 3;
    optional string tag       = 4;
    optional uint32 log_level = 5;
}

message Payload {
    optional uint64 mmap_count   = 1;
    optional uint64 mremap_count = 2;
    repeated SyscallsIOPattern io_patterns = 3;
    IOFlags io_flags = 4;
}

message IOFlags {
    optional uint64 direct  = 1; // O_DIRECT - direct IO, bypasses page cache
    optional uint64 sync    = 2; // O_SYNC - synchronous IO (data + metadata)
    optional uint64 dsync   = 3; // O_DSYNC - data-synchronous IO (data only)
    optional uint64 append  = 4; // O_APPEND - append write
    optional uint64 nowait  = 5; // O_NONBLOCK - non-blocking IO (NONWAIT semantics)
    optional uint64 async   = 6; // FASYNC - async notification
    optional uint64 no_cache = 7; // IOCB_DONTCARE
    optional uint64 hiprio  = 8; // IORING_SQ_NEED_WAKEUP - high-priority io_uring IO
}

message SyscallsIOPattern {
    IoType           io_type      = 1;
    optional uint64  io_size_bytes = 2;
    optional uint64  io_count      = 3;
    optional uint64  total_time    = 4;
}

message StatLog {
    GenericFormat generic_format = 1;
    Payload       payload         = 2;
}

message StatLogs {
    repeated StatLog stats_log = 1;
}