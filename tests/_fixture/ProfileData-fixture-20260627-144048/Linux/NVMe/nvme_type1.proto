
syntax = "proto3";
package fix.nvme1;
message Rec {
  string timestamp = 1;
  string hostname  = 2;
  uint32 component = 3;
  uint32 tag       = 4;
  uint32 loglevel  = 5;
  message Payload {
    uint64 event_seq = 1;
    uint32 qid       = 2;
    uint32 cid       = 3;
    uint64 slba      = 4;
  }
  Payload payload = 6;
}