
syntax = "proto3";
package fix.block1;
message Rec {
  string timestamp = 1;
  string hostname  = 2;
  uint32 component = 3;
  uint32 tag       = 4;
  uint32 loglevel  = 5;
  message Payload {
    uint64 event_seq  = 1;
    string disk       = 2;
    string op         = 3;
    uint32 bytes      = 4;
    uint64 latency_ns = 5;
    int32  error      = 6;
  }
  Payload payload = 6;
}