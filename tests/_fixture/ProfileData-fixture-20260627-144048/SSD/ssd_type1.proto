
syntax = "proto3";
package fix.ssd1;
message Rec {
  string timestamp = 1;
  string hostname  = 2;
  uint32 component = 3;
  uint32 tag       = 4;
  uint32 loglevel  = 5;
  message Payload {
    uint64 event_seq      = 1;
    float  temperature_c  = 2;
    uint64 power_on_hours = 3;
  }
  Payload payload = 6;
}