    type: UInt64
    meaning: 'Write requests counted by their latency in the driver layer. The ranges are
      in the latency_buckets table, one row per bucket (ADR-0011): option_index 0 is lh_opt1
      (below the first threshold), i is bw_opt<i>_and_opt<i+1>, and n - the number of thresholds
      given - is overflow; its range column labels the bucket, for example 1-10 µs. Each lower
      bound is included (Q12), and the buckets past the last threshold given stay 0 (Q16). Each
      request is counted in one bucket, so together they count the
      completed writes (Q13). Collected separately from write_block_driver_time_ns (Q8).'
    unit: count
    kind: counter
    status: draft
    basis: team answers to Q8 and Q11 to Q13; ADR-0011; field names
