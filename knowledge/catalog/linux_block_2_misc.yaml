metrics:
- metric: read_split_share_pct
  meaning: Share of read bios that were split.
  formula: read_splits_delta / nullIf(read_bios_delta, 0) * 100
  unit: percent
  status: draft
- metric: write_split_share_pct
  meaning: Share of write bios that were split.
  formula: write_splits_delta / nullIf(write_bios_delta, 0) * 100
  unit: percent
  status: draft
- metric: avg_read_bio_size_kib
  meaning: Average size of a read bio when submitted.
  formula: cumulative_read_io_size_bytes_delta / 1024 / nullIf(read_bios_delta, 0)
  unit: KiB
  status: draft
  note: Depends on Q2.
- metric: avg_write_bio_size_kib
  meaning: Average size of a write bio when submitted.
  formula: cumulative_write_io_size_bytes_delta / 1024 / nullIf(write_bios_delta, 0)
  unit: KiB
  status: draft
  note: Depends on Q2.
- metric: avg_read_device_time_us
  meaning: Average time a read I/O spent in the device, over the interval. Empty when there were no
    reads.
  formula: read_device_time_ns_delta / 1000 / nullIf(total_read_ios_delta, 0)
  unit: microseconds
  status: draft
  note: Per I/O, an I/O being a bio (Q17).
- metric: avg_write_device_time_us
  meaning: Average time a write I/O spent in the device, over the interval. Empty when there were
    no writes.
  formula: write_device_time_ns_delta / 1000 / nullIf(total_write_ios_delta, 0)
  unit: microseconds
  status: draft
  note: Per I/O, an I/O being a bio (Q17).
- metric: avg_read_driver_time_us
  meaning: Average time a read I/O spent in the driver layer, over the interval. Empty when there
    were no reads.
  formula: read_block_driver_time_ns_delta / 1000 / nullIf(total_read_ios_delta, 0)
  unit: microseconds
  status: draft
  note: Per I/O, an I/O being a bio (Q17).
- metric: avg_write_driver_time_us
  meaning: Average time a write I/O spent in the driver layer, over the interval. Empty when there
    were no writes.
  formula: write_block_driver_time_ns_delta / 1000 / nullIf(total_write_ios_delta, 0)
  unit: microseconds
  status: draft
  note: Per I/O, an I/O being a bio (Q17).
