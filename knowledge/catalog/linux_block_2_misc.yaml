table: linux_block_2_misc
proto: linux_block_2_misc.proto
schema_fingerprint: sha256:cc78c850e8dc5504
collector: blk_bio_queue
component: 101
collected_from: 'eBPF: tp_btf/block_bio_queue (a bio is submitted: bio counts, sizes, REQ_* flags) and
  tp_btf/block_split (a bio is split), per docs/Tracepoints-details.md; the back and front merges
  at the kernel events block_bio_backmerge and block_bio_frontmerge (Q8). The hooks behind the
  driver and device times and the latency buckets are not documented yet.'
counts_since: profiler start
sampling: 'Every -i seconds (default 1 s). The eBPF counters keep growing; each sample copies the
  running totals (docs/Profile-code-flow.md: "snapshot, not reset"), so the change between two
  samples is the activity in between.'
device_filter: In the kernel, by disk name (config_map) - only the device given with -dev.
observes: Bios as they enter the block layer, before merging, plus bio splits and merges, the
  REQ_* flags bios carry, and the time I/Os spend in the driver and on the device. Bios are counted
  once, when submitted (Q9), so a bio that is later merged or fails is still counted. Whether sizes
  are counted before or after splitting is open (Q2).
status: draft
questions:
- id: Q1
  question: total_read_ios and read_bios are both read counts. How do they differ? Is total_read_ios
    = read_bios + read_splits (the number of I/Os after splitting)?
  answer: 'They are the same count: total_read_ios = read_bios and total_write_ios = write_bios.
    (Team, 2026-10-12)'
- id: Q2
  question: Are bios counted by size once, when submitted (before splitting), or are the pieces
    counted after splitting? The same question applies to cumulative_*_io_size_bytes.
  answer: TODO
  note: The team is checking (2026-10-15).
- id: Q3
  question: Is read_unaligned equal to the sum of the twelve read_*_range columns? If so, the
    check 'exact sizes + unaligned = total' must add read_unaligned or the ranges, never both.
  answer: 'Yes: read_unaligned = read_lt_4kb_range + ... + read_4mto8m_range. "Ideally": a small
    difference is possible, so a data check reports it as a warning, not an error. (Team,
    2026-10-12 and 2026-10-15)'
- id: Q4
  question: 'Which total should the size buckets add up to: read_bios or total_read_ios?'
  answer: 'read_bios, which equals total_read_ios. (Team, 2026-10-12) The sum is corrected by Q15:
    read_lt_4kb is left out, because those bios are also in read_unaligned.'
- id: Q5
  question: read_lt_4kb and read_lt_4kb_range both mean 'smaller than 4 KiB'. What goes in each?
    What is an exact size below 4 KiB (512 bytes, 1 KiB, 2 KiB)?
  answer: 'Both count every bio smaller than 4 KiB, so they hold the same number: read_lt_4kb in the
    aligned sizes, read_lt_4kb_range in the unaligned ones. A known double count - Profile FW will
    remove one of the two later. (Team, 2026-10-12 and 2026-10-15)'
- id: Q6
  question: 'Are the sizes powers of two: 4kb = 4,096 bytes and 1mb = 1,048,576 bytes?'
  answer: Yes. (Team, 2026-10-12)
- id: Q7
  question: 'Where does a bio larger than 8 MiB go: read_gt_8mb always, or read_unaligned when
    its size is not a power of two?'
  answer: 'Always read_gt_8mb: it counts every bio larger than 8 MiB, aligned or not. read_unaligned
    counts only the unaligned bios larger than 0 and smaller than 8 MiB - those in the twelve
    ranges. (Team, 2026-10-15)'
- id: Q8
  question: 'Which kernel event does each newer field count? Our guesses: the back and front merges
    are the tracepoints block_bio_backmerge and block_bio_frontmerge (a bio is added to the end, or
    the start, of a request already waiting); block driver time runs from a bio''s submission
    (block_bio_queue) until its request is sent to the device (block_rq_issue); device time runs
    from block_rq_issue until the device completes the request (block_rq_complete). The same two
    times decide the driver and device latency buckets. Please ask Profile FW to confirm or correct
    each.'
  answer: 'Merges: counted at the kernel events block_bio_backmerge and block_bio_frontmerge. Driver
    time: the time spent in the driver layer only. Device time: the time spent in the device only.
    Our guesses for the two times were wrong - block-layer time is in neither. The latency buckets
    are separate fields from the time totals (independent, peers in the proto). (Team, 2026-10-15)'
  note: Reworded on 2026-10-12 - the first wording was unclear.
- id: Q9
  question: Are the *_io_flags_* columns counted once per bio, at submission? A bio can carry
    several flags, so we expect the flag columns NOT to add up to the bio count - correct?
  answer: 'Yes: once per bio, at submission, so the flag columns do not add up to the bio count.
    (Team, 2026-10-15)'
- id: Q10
  question: 'read_device_time_ns and read_block_driver_time_ns: exactly which intervals do they
    measure (for example driver = from bio submission to request issue, device = from issue to
    completion)? Are they added up over all requests?'
  answer: 'Added up over all requests. Like every field here, they are running totals since the
    profiler started, sampled every -i seconds. (Team, 2026-10-12) What they measure: see Q8.'
- id: Q11
  question: 'Latency buckets: what are the thresholds opt1 to opt16 - values and unit? Are they
    fixed, or set per run - and if per run, where are they recorded? Without them the latency
    histograms cannot be read.'
  answer: 'Set per run by the user, in microseconds: for example profile_fw -lat-buckets 1,10,100,1000.
    Up to 16 thresholds, so up to 17 buckets; there is one set, so the same thresholds apply
    to all four latency histograms. (Team, 2026-10-12) They are not in the rows: the profiler
    writes them to latency_bucket_options.yaml (keys lat_option_us_1 to lat_option_us_n), and
    the loader stores them in the latency_buckets table, one row per bucket, with a range label
    such as 100 µs - 1 ms (ADR-0011).'
  note: Corrected on 2026-10-20. This answer was first read as 16 columns in every row; the first
    real run has none, and has the latency_buckets table.
- id: Q12
  question: 'Latency bucket names: does ''lh'' in latency_lh_opt1 mean ''lower than''? Does ''bw''
    mean ''between'', and is each lower bound included?'
  answer: 'Yes: lh = lower than, bw = between, and each lower bound is included. (Team, 2026-10-12)'
- id: Q13
  question: Is each request counted in exactly one latency bucket, so the 17 buckets add up to
    the number of completed requests?
  answer: 'Yes, ideally. A small difference is possible, so a data check reports it as a warning.
    (Team, 2026-10-12)'
- id: Q14
  question: 'The proto as received did not compile: read_io_flags and write_io_flags used the
    type ''BiOpfFlags'', while the message is named ''BioOpFlags''. Our copy now uses BioOpFlags.
    Please confirm Profile FW''s own file matches.'
  answer: 'The correct name is BiOpFlags. Our copy now uses it for the message and for both fields.
    (Team, 2026-10-12)'
- id: Q15
  question: 'The answers to Q3, Q4 and Q5 count a bio smaller than 4 KiB twice: it is in read_lt_4kb,
    an exact size (Q4), and also in read_lt_4kb_range (Q5), which is part of read_unaligned (Q3).
    So "exact sizes + read_unaligned = read_bios" cannot hold when there are bios under 4 KiB.
    Which should change: read_unaligned leaves out read_lt_4kb_range; or read_lt_4kb is not counted
    as an exact size; or something else?'
  answer: 'There are two ways of sorting sizes: aligned (read_lt_4kb, read_4kb ... read_8mb,
    read_gt_8mb) and unaligned (the twelve ranges, which add up to read_unaligned). A bio under
    4 KiB is counted in both - read_lt_4kb and read_lt_4kb_range - a double count Profile FW will
    remove later. (Team, 2026-10-15) So, without counting any bio twice: read_bios = read_4kb +
    ... + read_8mb + read_gt_8mb + read_unaligned. (Derived from the answers - to be confirmed on
    the first real run.)'
- id: Q16
  question: 'With fewer than 16 thresholds - for example -lat-buckets 1,10,100,1000, which gives
    5 ranges: below 1, 1-10, 10-100, 100-1000 and above 1000 microseconds - where are requests above
    the last threshold counted: in latency_bw_opt4_and_opt5, or in latency_overflow? And what do the
    unused lat_option_us_5 to lat_option_us_16 hold: 0?'
  answer: 'Four thresholds give five ranges - below 1, 1-10, 10-100, 100-1000 and above 1000
    microseconds - and the last range is counted in latency_overflow. Unused thresholds are 0.
    (Team, 2026-10-15) So the buckets past the last threshold given (here latency_bw_opt4_and_opt5
    and later) stay 0 - our reading.'
  note: latency_buckets holds only the thresholds given - n thresholds give n+1 rows (ADR-0011) -
    so an unused threshold is simply not there.
- id: Q17
  question: 'An average time per I/O needs a count to divide read_device_time_ns (or
    read_block_driver_time_ns) by. Which is right: the completed requests - the sum of the read
    device latency buckets - or read_bios?'
  answer: 'The times are added up per I/O, and every layer is sampled each second. (Team, 2026-10-15)
    An I/O here is a bio (total_read_ios = read_bios, Q1), so the average time per I/O in an
    interval is the change in read_device_time_ns divided by the change in total_read_ios - our
    reading of the answer.'
