      write_io_flags_req_rahead, write_io_flags_req_background, write_io_flags_req_nowait, write_io_flags_req_polled,
      write_io_flags_req_alloc_cache, write_io_flags_req_swap, write_io_flags_req_drv, write_io_flags_req_fs_private,
      write_io_flags_req_atomic, write_io_flags_req_nounmap]
    type: UInt64
    meaning: 'Write bios with the matching kernel REQ_* flag set, counted once per bio when it is
      submitted (Q9): write_io_flags_req_sync = REQ_SYNC, write_io_flags_req_fua = REQ_FUA (force
      unit access), write_io_flags_req_rahead = REQ_RAHEAD (readahead), write_io_flags_req_preflush
      = REQ_PREFLUSH. A bio can carry several flags, so these columns do not add up to the bio
      count.'
    unit: count
    kind: counter
    status: draft
    basis: Linux kernel include/linux/blk_types.h (REQ_* flags); team answer to Q9 (2026-10-15)
  - group: Write device latency buckets
    columns: [write_device_latency_latency_lh_opt1, write_device_latency_latency_bw_opt1_and_opt2,
      write_device_latency_latency_bw_opt2_and_opt3, write_device_latency_latency_bw_opt3_and_opt4,
      write_device_latency_latency_bw_opt4_and_opt5, write_device_latency_latency_bw_opt5_and_opt6,
      write_device_latency_latency_bw_opt6_and_opt7, write_device_latency_latency_bw_opt7_and_opt8,
      write_device_latency_latency_bw_opt8_and_opt9, write_device_latency_latency_bw_opt9_and_opt10,
      write_device_latency_latency_bw_opt10_and_opt11, write_device_latency_latency_bw_opt11_and_opt12,
      write_device_latency_latency_bw_opt12_and_opt13, write_device_latency_latency_bw_opt13_and_opt14,
      write_device_latency_latency_bw_opt14_and_opt15, write_device_latency_latency_bw_opt15_and_opt16,
      write_device_latency_latency_overflow]
    type: UInt64
    meaning: 'Write requests counted by their latency in the device. The ranges are
      in the latency_buckets table, one row per bucket (ADR-0011): option_index 0 is lh_opt1
      (below the first threshold), i is bw_opt<i>_and_opt<i+1>, and n - the number of thresholds
      given - is overflow; its range column labels the bucket, for example 1-10 µs. Each lower
      bound is included (Q12), and the buckets past the last threshold given stay 0 (Q16). Each
      request is counted in one bucket, so together they count the
      completed writes (Q13). Collected separately from write_device_time_ns (Q8).'
    unit: count
    kind: counter
    status: draft
    basis: team answers to Q8 and Q11 to Q13; ADR-0011; field names
    note: Fewer than 16 thresholds - see Q16.
